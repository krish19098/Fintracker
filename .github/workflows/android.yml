name: Android build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The default also installs the legacy "tools" package, which current sdkmanager no longer has.
          packages: platform-tools

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Lint, test and build release APK
        run: ./gradlew lint test assembleRelease --stacktrace

      - name: Test summary
        if: always()
        run: |
          for f in app/build/test-results/test*UnitTest/*.xml; do
            grep -o '<testsuite name="[^"]*" tests="[0-9]*" skipped="[0-9]*" failures="[0-9]*" errors="[0-9]*"' "$f" || true
          done

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roborazzi-screenshots
          path: app/build/outputs/roborazzi/
          if-no-files-found: ignore

      - name: Screenshot contact sheet (log preview)
        if: always()
        run: |
          python3 -m pip install --quiet pillow || exit 0
          python3 - <<'PY'
          import base64, glob, io, os
          from PIL import Image
          files = sorted(glob.glob("app/build/outputs/roborazzi/design_*.png"))
          if not files:
              raise SystemExit("no screenshots")
          imgs = [Image.open(f).convert("RGB") for f in files]
          w = 270
          thumbs = [i.resize((w, max(1, i.height * w // i.width))) for i in imgs]
          cols = 4
          rows = [thumbs[k:k + cols] for k in range(0, len(thumbs), cols)]
          sheet = Image.new("RGB", (w * cols + 4 * cols, sum(max(t.height for t in r) + 4 for r in rows)), "white")
          y = 0
          for r in rows:
              for c, t in enumerate(r):
                  sheet.paste(t, (c * (w + 4), y))
              y += max(t.height for t in r) + 4
          buf = io.BytesIO()
          sheet.save(buf, "PNG", optimize=True)
          print("FILES " + " ".join(os.path.basename(f) for f in files))
          print("SHEET_B64 " + base64.b64encode(buf.getvalue()).decode())
          PY

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.txt

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk app-release.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: SpendSense v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          body: |
            Automated build from ${{ github.sha }}.
            Download app-release.apk on your phone and install it over the previous version.
          files: app-release.apk
